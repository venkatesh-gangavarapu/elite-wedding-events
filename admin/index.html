<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite Wedding Events — Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="wrap"><header><div><small>ELITE WEDDING EVENTS</small><h1>Portfolio Admin</h1></div><button id="logout" class="ghost hidden">Logout</button></header>
<section id="login" class="panel"><h2>Owner Login</h2><p>Sign in to add and manage events.</p><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="loginMsg"></p></section>
<section id="dashboard" class="hidden"><div class="stats"><div><b id="count">0</b><span>Events</span></div><div><b>₹0</b><span>Hosting target</span></div></div>
<div class="panel"><h2>Add New Event</h2><form id="eventForm"><input id="title" required placeholder="Event name"><select id="category" required><option value="">Choose category</option><option>Weddings</option><option>Birthday Parties</option><option>Naming Ceremonies</option><option>Housewarming</option><option>Corporate Events</option><option>College Events</option><option>School Fest</option><option>Festival Events</option><option>Entertainment</option><option>Other</option></select><input id="location" value="Nellore" placeholder="Location"><input id="date" type="date"><textarea id="description" placeholder="Short description"></textarea><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required><label class="check"><input id="published" type="checkbox" checked> Publish immediately</label><button type="submit">Upload & Publish</button><p id="formMsg"></p></form></div>
<div class="panel"><h2>Existing Events</h2><div id="events"></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="admin.js"></script></body></html>
